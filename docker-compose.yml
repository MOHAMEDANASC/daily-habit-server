# Local PostgreSQL for development:  docker compose up -d
# Then use in backend/.env:
#   DATABASE_URL="postgresql://habit:habit_dev_password@localhost:5432/habit_tracker?schema=public"
#   TEST_DATABASE_URL="postgresql://habit:habit_dev_password@localhost:5432/habit_tracker_test?schema=public"
# These credentials are for local development only. Never reuse them in production.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit_dev_password
      POSTGRES_DB: habit_tracker
    ports:
      - "5432:5432"
    volumes:
      - habit_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit -d habit_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  habit_pgdata:
